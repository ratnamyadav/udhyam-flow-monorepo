name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time only — real values live in repo secrets / hosted env.
      # These satisfy our @udyamflow/env Zod schema during `next build`
      # so the env-validation gate doesn't crash CI.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=require
      BETTER_AUTH_SECRET: ci-build-secret-not-used-in-runtime-thirty-two-chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node can resolve its store for
      # `cache: pnpm`. The version comes from package.json#packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
